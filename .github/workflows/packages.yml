name: Component index

# Build and sign the component (packages) index and publish it:
#   - commit mirror/packages.json + mirror/packages.json.sig to `mirror-data`
#     (served to devices over raw.githubusercontent + jsDelivr)
#
# Components come from packages/sources.json; each entry is resolved from the
# upstream GitHub release, sha256'd, version-parsed and Ed25519-signed. Runs on a
# schedule and on demand.
on:
  schedule:
    # 03:17 UTC (11:17 Beijing) — offset from the release job to avoid overlap
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Optional comma-separated component names to (re)build
        required: false

permissions:
  contents: write

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cryptography
        run: pip install --no-input cryptography

      - name: Build and publish component index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALWAYSSTRONG_SIGNING_KEY: ${{ secrets.ALWAYSSTRONG_SIGNING_KEY }}
          MIRROR_REMOTE: origin
          PKG_ONLY: ${{ github.event.inputs.only }}
        run: bash scripts/publish-packages.sh "${{ github.repository }}"
